<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b14" />
    <meta
      name="description"
      content="Prakhar Madhesiya is an AI and machine learning student building thoughtful, practical software and AI applications."
    />
    <meta property="og:title" content="Prakhar Madhesiya — AI/ML Developer" />
    <meta
      property="og:description"
      content="Exploring artificial intelligence, building intelligent applications, and transforming ideas into practical solutions."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("prakhar-portfolio-theme");
          const theme = saved === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("light", theme === "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>Prakhar Madhesiya — AI/ML Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
